version: '3.8'

services:
  deepseek-ocr:
    image: neosun/deepseek-ocr:latest
    container_name: deepseek-ocr-webui
    ports:
      - "8001:8001"
    shm_size: 8g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # 端口映射 - 开放所有 IP 访问
    ports:
      - "0.0.0.0:8001:8001"
    
    # 环境变量
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_USE_V1=0
      - PYTHONUNBUFFERED=1
    
    # 挂载卷（用于模型缓存）
    volumes:
      - ./models:/root/.cache/huggingface
      - ./logs:/app/logs
    
    # 共享内存大小（vLLM 需要）
    shm_size: "16g"
    
    # 重启策略
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
